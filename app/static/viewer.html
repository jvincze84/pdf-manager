<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <script>
    (function () {
      var t = localStorage.getItem("theme");
      if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <meta name="theme-color" content="#e5484d">
</head>
<body class="viewer-page">
<header class="viewer-bar">
  <a class="btn ghost icon" id="backBtn" href="./" title="Back to the list" aria-label="Back">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <div class="viewer-title" id="docTitle"><span class="viewer-dir" id="docDir"></span><span id="docName"></span></div>
  <a class="btn small" id="browserBtn" target="_blank" rel="noopener" title="Open the PDF in the browser's own viewer">
    <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="hide-narrow">Open in browser</span>
  </a>
  <a class="btn small icon" id="downloadBtn" title="Download" aria-label="Download">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M4 20h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
</header>
<div class="viewer-msg" id="viewerMsg" hidden></div>
<iframe class="viewer-frame" id="viewerFrame" title="PDF viewer" allowfullscreen></iframe>
<script src="pwa.js"></script>
<script src="viewer.js"></script>
</body>
</html>
